# Fans OTLP out to Aspire (traces, metrics, logs) and to Prometheus (metrics only).
# Apps keep exporting to 127.0.0.1:4317. Cardinality is decided in Core, before export:
# queue and event type are tags, a user id is not.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp/aspire:
    endpoint: aspire-dashboard:18889
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]

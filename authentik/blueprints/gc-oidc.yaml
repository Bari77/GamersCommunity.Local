# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: GamersCommunity OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: gc-front-provider
    state: present
    identifiers:
      name: GamersCommunity Front
    attrs:
      name: GamersCommunity Front
      client_type: public
      client_id: gc-front
      include_claims_in_id_token: true
      issuer_mode: per_provider
      # UUID sub so MainSite can keep Guid IdKeycloak / IdpSubject
      sub_mode: user_uuid
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:4200/auth/callback
        - matching_mode: strict
          url: http://127.0.0.1:4200/auth/callback
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, profile]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [scope_name, offline_access]

  - model: authentik_core.application
    id: gc-front-app
    state: present
    identifiers:
      slug: gc-front
    attrs:
      name: GamersCommunity Front
      slug: gc-front
      policy_engine_mode: any
      provider: !KeyOf gc-front-provider
      meta_launch_url: http://localhost:4200/
